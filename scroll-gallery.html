<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RIPUDAMAN - Scroll Gallery</title>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #0e0d0b;
            --paper: #f5f0e9;
            --accent: #c1783a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            font-family: "Space Grotesk", sans-serif;
            background: #0b0a09;
            color: #ffffff;
            overflow: hidden;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(8, 7, 6, 0.55);
            backdrop-filter: blur(14px);
        }

        .logo {
            font-family: "Fraunces", serif;
            letter-spacing: 1px;
            font-size: 22px;
        }

        nav {
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        nav a {
            color: #f7f3ee;
            text-decoration: none;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        nav a:hover {
            color: var(--accent);
        }

        .gallery {
            height: 100vh;
            height: 100svh;
            width: 100vw;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: pan-y;
        }

        .slide {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            transition: opacity 0.7s ease, transform 0.7s ease;
            opacity: 0;
            transform: scale(1.03);
        }

        .slide.active {
            opacity: 1;
            transform: scale(1);
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(4,4,4,0.2) 0%, rgba(4,4,4,0.55) 65%, rgba(4,4,4,0.8) 100%);
        }

        .caption {
            position: relative;
            z-index: 2;
            text-align: center;
            max-width: 680px;
            padding: 0 24px;
        }

        .caption h1 {
            font-family: "Fraunces", serif;
            font-size: 44px;
            line-height: 1.1;
            margin-bottom: 16px;
        }

        .caption p {
            font-size: 15px;
            color: #e8dfd5;
        }

        .scroll-hint {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #f6efe6;
            z-index: 2;
        }

        .dots {
            position: absolute;
            right: 24px;
            bottom: 30px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 2;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .dot.active {
            background: #ffffff;
        }

        @media (max-width: 720px) {
            header {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
                padding: 14px 18px;
            }

            nav {
                justify-content: flex-start;
                gap: 12px;
            }

            .caption h1 {
                font-size: 30px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">RIPUDAMAN</div>
        <nav>
            <a href="index.html">Classic</a>
            <a href="portfolio.html">Gothic</a>
            <a href="professional.html">Professional</a>
            <a href="avant-garde.html">Avant Garde</a>
            <a href="scroll-gallery.html">Scroll Gallery</a>
        </nav>
    </header>

    <main class="gallery" id="gallery">
        <div class="slide active" style="background-image: url('https://images.unsplash.com/photo-1490481651871-ab68de25d43d?auto=format&fit=crop&w=1600&q=80');"></div>
        <div class="slide" style="background-image: url('https://images.unsplash.com/photo-1503342394128-c104d54dba01?auto=format&fit=crop&w=1600&q=80');"></div>
        <div class="slide" style="background-image: url('https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=1600&q=80');"></div>
        <div class="slide" style="background-image: url('https://images.unsplash.com/photo-1487412720507-e7ab37603c6f?auto=format&fit=crop&w=1600&q=80');"></div>
        <div class="overlay"></div>
        <div class="caption" id="caption">
            <h1>Tailoring in Motion</h1>
            <p>Scroll to reveal the next full-page image. Each scroll step transitions to a new look.</p>
        </div>
        <div class="scroll-hint">Scroll Down</div>
        <div class="dots" id="dots"></div>
    </main>

    <script>
        const slides = Array.from(document.querySelectorAll(".slide"));
        const dotsContainer = document.getElementById("dots");
        let currentIndex = 0;
        let isThrottled = false;
        let touchStartY = 0;
        let touchEndY = 0;

        const copy = [
            {
                title: "Tailoring in Motion",
                body: "Scroll to reveal the next full-page image. Each scroll step transitions to a new look."
            },
            {
                title: "Midnight Tuxedo",
                body: "A cinematic silhouette with a satin lapel and a crisp structured shoulder."
            },
            {
                title: "Signature Wool",
                body: "Precision cuts and fabric texture that moves with every step."
            },
            {
                title: "Linen Capsule",
                body: "Lightweight, airy tailoring designed for summer celebrations."
            }
        ];

        const captionTitle = document.querySelector(".caption h1");
        const captionBody = document.querySelector(".caption p");

        function renderDots() {
            dotsContainer.innerHTML = "";
            slides.forEach((_, index) => {
                const dot = document.createElement("span");
                dot.className = "dot" + (index === currentIndex ? " active" : "");
                dotsContainer.appendChild(dot);
            });
        }

        function showSlide(index) {
            slides.forEach((slide, i) => {
                slide.classList.toggle("active", i === index);
            });

            captionTitle.textContent = copy[index].title;
            captionBody.textContent = copy[index].body;
            renderDots();
        }

        function changeSlide(direction) {
            if (isThrottled) return;
            isThrottled = true;

            currentIndex = (currentIndex + direction + slides.length) % slides.length;
            showSlide(currentIndex);

            setTimeout(() => {
                isThrottled = false;
            }, 700);
        }

        window.addEventListener("wheel", (event) => {
            if (event.deltaY > 30) {
                changeSlide(1);
            } else if (event.deltaY < -30) {
                changeSlide(-1);
            }
        }, { passive: true });

        window.addEventListener("touchstart", (event) => {
            touchStartY = event.touches[0].clientY;
        }, { passive: true });

        window.addEventListener("touchend", (event) => {
            touchEndY = event.changedTouches[0].clientY;
            const distance = touchStartY - touchEndY;
            if (Math.abs(distance) < 40) return;
            changeSlide(distance > 0 ? 1 : -1);
        });

        window.addEventListener("keydown", (event) => {
            if (event.key === "ArrowDown") {
                changeSlide(1);
            }
            if (event.key === "ArrowUp") {
                changeSlide(-1);
            }
        });

        renderDots();
    </script>
</body>
</html>
